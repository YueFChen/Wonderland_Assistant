<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      let mode = 'system'
      try {
        const cached = localStorage.getItem('wonderland.theme.mode')
        if (['light', 'dark', 'system', 'custom'].includes(cached)) mode = cached
      } catch (_) { /* Continue with the system preference when storage is unavailable. */ }
      const dark = mode === 'dark' || ((mode === 'system' || mode === 'custom') && matchMedia('(prefers-color-scheme: dark)').matches)
      document.documentElement.dataset.theme = dark ? 'dark' : 'light'
    </script>
    <title>Wonderland Assistant</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
