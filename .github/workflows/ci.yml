name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend（typecheck / build）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: node --check scripts/create-plugin.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - run: pnpm -r run test
      - run: pnpm --filter @wonderland/desktop-ui run build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ui-dist
          path: apps/desktop/ui/dist

  rust:
    name: Rust（fmt / clippy / test / build）
    needs: frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: desktop-ui-dist
          path: apps/desktop/ui/dist
      - name: 显示生效工具链（由 rust-toolchain.toml 固定）
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p wonderland-kernel --example generate_bindings --features bindings -- --check
      - run: cargo run --locked -p wonderland-plugin-protocol --example generate_bindings --features bindings -- --check
      - run: cargo build --workspace --locked
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify Windows Core bundle
        shell: pwsh
        run: |
          $bundles = @(Get-ChildItem -Path 'target/release/bundle' -Recurse -File |
            Where-Object { $_.Extension -in '.msi', '.exe' })
          if ($bundles.Count -eq 0) { throw 'Windows installer missing from target/release/bundle' }
          $bundles | Select-Object -ExpandProperty FullName
      - name: Install package and verify shipped wla CLI
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path 'target/release/bundle/nsis' -Filter '*.exe' -File)
          if ($installers.Count -eq 0) { throw 'NSIS installer missing from target/release/bundle/nsis' }
          $installRoot = Join-Path $env:TEMP "WonderlandAssistant-InstallCheck-$env:GITHUB_RUN_ID"
          $installerProcess = Start-Process -FilePath $installers[0].FullName -ArgumentList @('/S', "/D=$installRoot") -Wait -PassThru -WindowStyle Hidden
          if ($installerProcess.ExitCode -ne 0) { throw "Silent installer returned $($installerProcess.ExitCode)." }
          $targetTriple = ((rustc -vV | Select-String '^host: (.+)$').Matches.Groups[1].Value)
          $cli = Join-Path $installRoot "resources/binaries/wla-$targetTriple.exe"
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) { throw "Installed wla sidecar missing at '$cli'." }
          $appVersion = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $reportedVersion = (& $cli --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $reportedVersion -ne "wla $appVersion") { throw "CLI version mismatch: '$reportedVersion'." }
          $profile = Join-Path $env:TEMP "WonderlandAssistant-CliCheck-$env:GITHUB_RUN_ID"
          $statusOutput = & $cli --data-dir $profile core status
          if ($LASTEXITCODE -ne 0) { throw 'Installed CLI core status command failed.' }
          $status = ($statusOutput -join "`n") | ConvertFrom-Json
          if (-not $status.ok -or $status.data.version -ne $appVersion -or $status.data.desktopRunning) { throw 'Installed CLI returned an invalid core status response.' }
          $stdout = Join-Path $env:TEMP "WonderlandAssistant-CliCheck-$env:GITHUB_RUN_ID.out"
          $stderr = Join-Path $env:TEMP "WonderlandAssistant-CliCheck-$env:GITHUB_RUN_ID.err"
          $invalid = Start-Process -FilePath $cli -ArgumentList @('--data-dir', $profile, 'invalid-command') -Wait -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if ($invalid.ExitCode -ne 2) { throw "Invalid CLI command returned exit code $($invalid.ExitCode), expected 2." }
          $failure = Get-Content -LiteralPath $stderr -Raw | ConvertFrom-Json
          if ($failure.ok -or $failure.error.code -ne 'INVALID_REQUEST') { throw 'Installed CLI returned an invalid error contract.' }

  supply-chain:
    name: Supply chain（cargo-deny）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
