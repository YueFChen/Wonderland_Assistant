name: Release Core

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      CORE_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Core release versions
        run: node scripts/check-core-release.mjs --tag "$CORE_RELEASE_TAG"
      - name: Require successful CI for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:GITHUB_SHA --limit 20 --json status,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Core CI status.' }
          if (-not ($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })) { throw 'This exact commit must pass Core CI before release.' }
      - name: Download and verify original signed Cloudflare installers
        run: node packages/core-updates/tools/prepare-github.mjs github-release "$GITHUB_REPOSITORY" "$CORE_RELEASE_TAG"
      - name: Create GitHub draft with verified assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$CORE_RELEASE_TAG" github-release/* --verify-tag --title "Wonderland Assistant $CORE_RELEASE_TAG" --notes-file RELEASE_NOTES.md --draft --repo "$GITHUB_REPOSITORY"
      - name: Publish GitHub Release after signature verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$CORE_RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"
