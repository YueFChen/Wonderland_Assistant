name: Release Core

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

concurrency:
  group: core-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Enforce plugin integration hold before creating any Release
        run: node scripts/check-core-release.mjs --tag ${{ github.ref_name }}
      - name: Require successful CI for this exact commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $runs = gh run list --repo $env:GITHUB_REPOSITORY --workflow ci.yml --commit $env:GITHUB_SHA --limit 20 --json status,conclusion | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not read Core CI status.' }
          if (-not ($runs | Where-Object { $_.status -eq 'completed' -and $_.conclusion -eq 'success' })) { throw 'This exact commit must pass Core CI before release.' }
      - uses: Swatinem/rust-cache@v2
      - name: Check release version and signing key
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $version = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag and Tauri version differ." }
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) { throw "TAURI_SIGNING_PRIVATE_KEY secret is missing." }
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --config src-tauri/tauri.release.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Wonderland Assistant ${{ github.ref_name }}
          releaseBody: Signed Windows update and installers.
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          releaseDraft: true
      - name: Publish GitHub Release after signed build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit ${{ github.ref_name }} --draft=false --latest --repo ${{ github.repository }}
